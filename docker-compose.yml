services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms256m -Xmx256m}"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-67108864}
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: ${KAFKA_MEM_LIMIT:-450m}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-rdf-events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-rdf-events.dlq}
    command:
      - bash
      - -lc
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_TOPIC}" --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_DLQ_TOPIC}" --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic "$${KAFKA_TOPIC}"

  fuseki-reader:
    build:
      context: .
      dockerfile: Dockerfile.fuseki
      args:
        JENA_VERSION: ${JENA_VERSION:-6.2.0}
        FUSEKI_KAFKA_VERSION: ${FUSEKI_KAFKA_VERSION:-3.1.0}
    image: jena-fuseki-kafka-demo:${JENA_VERSION:-6.2.0}-${FUSEKI_KAFKA_VERSION:-3.1.0}
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      ENV_KAFKA_TOPIC: ${KAFKA_TOPIC:-rdf-events}
      ENV_KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-rdf-events.dlq}
      ENV_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ENV_FUSEKI_GROUP_ID: "jena-reader-$${HOSTNAME}"
      JAVA_OPTIONS: "${FUSEKI_JAVA_OPTIONS:--Xms512m -Xmx1536m -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC}"
    volumes:
      - ./fuseki/config-reader.ttl:/fuseki/config/config.ttl:ro
    expose:
      - "3030"
    mem_limit: ${FUSEKI_MEM_LIMIT:-2g}

  nginx-read:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    restart: unless-stopped
    depends_on:
      fuseki-reader:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  locust:
    build:
      context: .
      dockerfile: Dockerfile.locust
    image: jena-locust-demo:0.1.0
    restart: unless-stopped
    depends_on:
      nginx-read:
        condition: service_healthy
    ports:
      - "${LOCUST_HOST_PORT:-8089}:8089"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-rdf-events}
      READ_BASE_URL: http://nginx-read
      DATASET_PATH: /ds
    command: ["-f", "/app/locustfile.py", "--host", "http://nginx-read"]

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-v0.7.2}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_HOST_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  kafka-data:
