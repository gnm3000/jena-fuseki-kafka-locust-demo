services:
  delta-server:
    build:
      context: .
      dockerfile: Dockerfile.delta-server
      args:
        RDF_DELTA_REF: ${RDF_DELTA_REF:-0a44c60368c523361fd2ba1d929023e5f1987ee0}
    image: jena-delta-server-demo:0.1.0
    restart: unless-stopped
    volumes:
      - delta-store:/delta/store
    expose:
      - "1066"
    mem_limit: ${DELTA_SERVER_MEM_LIMIT:-512m}

  delta-init:
    image: jena-delta-server-demo:0.1.0
    depends_on:
      delta-server:
        condition: service_healthy
    entrypoint: []
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        SERVER="http://delta-server:1066/"
        LOG="${DELTA_PATCHLOG:-rdf-events}"
        if java -cp /delta/delta-server.jar dcmd ls --server "$$SERVER" | grep -q " $${LOG} "; then
          echo "patch log $${LOG} already exists"
        else
          java -cp /delta/delta-server.jar dcmd mklog --server "$$SERVER" "$${LOG}"
        fi
        java -cp /delta/delta-server.jar dcmd ls --server "$$SERVER"

  fuseki-writer:
    build:
      context: .
      dockerfile: Dockerfile.fuseki
      args:
        RDF_DELTA_REF: ${RDF_DELTA_REF:-0a44c60368c523361fd2ba1d929023e5f1987ee0}
    image: jena-delta-fuseki-demo:0.1.0
    restart: unless-stopped
    depends_on:
      delta-init:
        condition: service_completed_successfully
    environment:
      JAVA_OPTIONS: "${FUSEKI_WRITER_JAVA_OPTIONS:--Xmx1536m -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC}"
    volumes:
      - ./fuseki/config-writer.ttl:/fuseki/config/config.ttl:ro
      - fuseki-writer-zone:/fuseki/zone
    expose:
      - "3030"
    mem_limit: ${FUSEKI_MEM_LIMIT:-2g}

  write-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: jena-write-gateway-demo:0.1.0
    restart: unless-stopped
    depends_on:
      fuseki-writer:
        condition: service_healthy
    environment:
      WRITER_BASE_URL: http://fuseki-writer:3030/ds
    ports:
      - "${GATEWAY_HOST_PORT:-8081}:8081"

  fuseki-reader:
    build:
      context: .
      dockerfile: Dockerfile.fuseki
      args:
        RDF_DELTA_REF: ${RDF_DELTA_REF:-0a44c60368c523361fd2ba1d929023e5f1987ee0}
    image: jena-delta-fuseki-demo:0.1.0
    restart: unless-stopped
    depends_on:
      delta-init:
        condition: service_completed_successfully
    environment:
      JAVA_OPTIONS: "${FUSEKI_JAVA_OPTIONS:--Xmx1536m -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC}"
    volumes:
      - ./fuseki/config-reader.ttl:/fuseki/config/config.ttl:ro
    expose:
      - "3030"
    mem_limit: ${FUSEKI_MEM_LIMIT:-2g}

  nginx-read:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    restart: unless-stopped
    depends_on:
      fuseki-reader:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  locust:
    build:
      context: .
      dockerfile: Dockerfile.locust
    image: jena-locust-demo:0.1.0
    restart: unless-stopped
    depends_on:
      nginx-read:
        condition: service_healthy
      write-gateway:
        condition: service_healthy
    ports:
      - "${LOCUST_HOST_PORT:-8089}:8089"
    environment:
      WRITE_BASE_URL: http://write-gateway:8081
      DATASET_PATH: /ds
    command: ["-f", "/app/locustfile.py", "--host", "http://nginx-read"]

volumes:
  delta-store:
  fuseki-writer-zone:
